services:
  svault:
    # Pull the published multi-arch image. To build from this checkout instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/atakon/svault:${SVAULT_TAG:-latest}
    container_name: svault
    restart: unless-stopped
    ports:
      - "${SVAULT_PORT:-8080}:4000"
    volumes:
      - svault-data:/data
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATA_DIR: /data
      # Optional external database. Empty keeps the bundled SQLite file.
      DATABASE_URL: "${DATABASE_URL:-}"
      PGSSLMODE: "${PGSSLMODE:-}"
      # Set to "true" when you put SVault behind HTTPS (recommended).
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Set to "true" to load the demo vault on first start (empty data volume).
      SEED_DEMO: "${SEED_DEMO:-false}"
      # Optional AI provider shared by every house. You can also set it per
      # house in Settings → AI (that value wins).
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-}"
      # Optional shared OpenFoodFacts receipt-name catalogue (JSON).
      SV_CATALOG_URL: "${SV_CATALOG_URL:-}"
      # Passkeys / OIDC (optional).
      RP_ID: "${RP_ID:-}"
      ORIGIN: "${ORIGIN:-}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      OIDC_ALLOWED_DOMAINS: "${OIDC_ALLOWED_DOMAINS:-}"
      OIDC_AUTO_PROVISION: "${OIDC_AUTO_PROVISION:-true}"
      OIDC_DEFAULT_HOUSE_ID: "${OIDC_DEFAULT_HOUSE_ID:-}"
      OIDC_LABEL: "${OIDC_LABEL:-Single sign-on}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  svault-data:
