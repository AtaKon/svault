name: Bug report
description: Something is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove passwords, API keys and personal photos from logs before posting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behaviour.
      placeholder: I pressed "Add stock" and ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The batch should have been added with the price ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SVault version or commit
      description: Shown in the footer/about area, or the image tag.
      placeholder: "1.0.0 / svault:latest / commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is SVault running?
      options:
        - Docker Compose
        - TrueNAS / Dockge
        - Bare Node.js (npm start)
        - Development server (npm run dev)
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Safari on iPhone 15 / Chrome 132 on Windows 11"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Console errors, `docker compose logs --tail=200 svault`, screenshots.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, passwords and personal data from this report.
          required: true
