name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # The SPA fallback test needs dist/client to exist.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test the production server
        run: |
          NODE_ENV=production PORT=4100 DATA_DIR=./data-ci npm start &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4100/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/smoke.mjs http://127.0.0.1:4100
