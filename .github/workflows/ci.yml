name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # The SPA fallback test needs dist/client to exist.
      - name: Build
        run: npm run build

      - name: Verify compiled server version
        run: |
          test -f dist/shared/version.js
          SV_VERSION= node --input-type=module -e 'import { APP_VERSION } from "./dist/server/config.js"; import pkg from "./package.json" with { type: "json" }; if (APP_VERSION !== pkg.version) throw new Error(`Expected ${pkg.version}, got ${APP_VERSION}`)'
          SV_VERSION=9.8.7 node --input-type=module -e 'import { APP_VERSION } from "./dist/server/config.js"; if (APP_VERSION !== "9.8.7") throw new Error(`Unexpected version: ${APP_VERSION}`)'

      - name: Test
        run: npm test

      - name: Smoke test the production server
        run: |
          NODE_ENV=production PORT=4100 DATA_DIR=./data-ci npm start &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4100/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/smoke.mjs http://127.0.0.1:4100

  postgres:
    # The default suite runs on SQLite. This runs the same suite against
    # PostgreSQL, so SQL that only SQLite accepts is caught before merge.
    name: Test on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: svault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d svault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The SPA fallback test needs dist/client to exist.
      - name: Build the client
        run: npm run build:web

      - name: Test on PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/svault_test
        run: npm run test:postgres
