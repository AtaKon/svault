version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Types must match the Node 22 runtime.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript majors need a dedicated migration, not a drive-by bump.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # pdf.js 6 removed document.destroy(); the scanner needs a dedicated
      # migration and bundled-worker verification before a major bump.
      - dependency-name: pdfjs-dist
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
